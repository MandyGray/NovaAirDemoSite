<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NovaAir</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #0A0A0A;
    overflow: hidden;
  }
  .stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
</style>
</head>
<body>
  <div class="stage">
    <img src="novaair-homepage.png" alt="NovaAir homepage">
  </div>
</body>
</html>
